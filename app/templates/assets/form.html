{% extends "base.html" %}

{% set active_nav = "assets" %}


{% block content %}

<div class="page-header">

    <div>
        <h1>{{ form_title }}</h1>
        <p>{{ form_description }}</p>
    </div>

</div>


<form
    method="post"
    action="{{ form_action }}"
    class="form-card"
>

    <div class="form-grid">

        <div class="form-group">

            <label>
                Name
            </label>

            <input
                name="name"
                value="{{ asset.name if asset else '' }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Hostname
            </label>

            <input
                name="hostname"
                value="{{ asset.hostname if asset else '' }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Asset Type
            </label>

            <select
                name="asset_type"
                required
            >

                <option value="">
                    Select type
                </option>

                {% for asset_type in asset_types %}
                <option
                    value="{{ asset_type }}"
                    {% if asset and asset.asset_type == asset_type %}selected{% endif %}
                >
                    {{ asset_type }}
                </option>
                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>
                IP Address
            </label>

            <input
                name="ip_address"
                value="{{ asset.ip_address if asset else '' }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Vendor
            </label>

            <input
                name="vendor"
                value="{{ (asset.vendor or '') if asset else '' }}"
            >

        </div>


        <div class="form-group">

            <label>
                Model
            </label>

            <input
                name="model"
                value="{{ (asset.model or '') if asset else '' }}"
            >

        </div>


        <div class="form-group">

            <label>
                Operating System
            </label>

            <input
                name="operating_system"
                value="{{ (asset.operating_system or '') if asset else '' }}"
            >

        </div>


        <div class="form-group">

            <label>
                Environment
            </label>

            <select
                name="environment"
                required
            >

                <option value="">
                    Select environment
                </option>

                {% for environment in environments %}
                <option
                    value="{{ environment }}"
                    {% if asset and asset.environment == environment %}selected{% endif %}
                >
                    {{ environment }}
                </option>
                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select
                name="status"
                required
            >

                <option value="">
                    Select status
                </option>

                {% for status in statuses %}
                <option
                    value="{{ status }}"
                    {% if asset and asset.status == status %}selected{% endif %}
                >
                    {{ status }}
                </option>
                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>
                Location
            </label>

            <input
                name="location"
                value="{{ (asset.location or '') if asset else '' }}"
            >

        </div>

    </div>


    <div class="form-group">

        <label>
            Description
        </label>

        <textarea
            name="description"
            rows="4"
        >{{ (asset.description or '') if asset else '' }}</textarea>

    </div>


    <div class="form-actions">

        <a
            href="{{ '/assets/' ~ asset.id if asset else '/assets' }}"
            class="btn-secondary"
        >
            Cancel
        </a>

        <button
            type="submit"
            class="btn"
        >
            {{ submit_label }}
        </button>

    </div>

</form>

{% endblock %}
