services:
  postgres:
    image: postgres:17
    container_name: infrastructure-ops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG:-latest}
    container_name: infrastructure-ops-web
    restart: unless-stopped

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8088"
      ]

    environment:
      APP_NAME: ${APP_NAME:-Infrastructure Operations Portal}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-production}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      AUTH_SESSION_LIFETIME_HOURS: ${AUTH_SESSION_LIFETIME_HOURS:-8}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      AUTH_LOGIN_BLOCK_SECONDS: ${AUTH_LOGIN_BLOCK_SECONDS:-600}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}

    ports:
      - "${APP_PORT:-8088}:8088"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

  monitoring-worker:
    image: ${DOCKER_IMAGE}:${IMAGE_TAG:-latest}
    container_name: infrastructure-ops-monitoring-worker
    restart: unless-stopped

    command:
      [
        "python",
        "-m",
        "app.workers.monitoring_worker"
      ]

    environment:
      APP_NAME: ${APP_NAME:-Infrastructure Operations Portal}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-production}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      MONITORING_SCHEDULER_POLL_SECONDS: ${MONITORING_SCHEDULER_POLL_SECONDS:-5}

    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_RAW

    read_only: true

    tmpfs:
      - /tmp

volumes:
  postgres_data:
