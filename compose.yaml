services:
  postgres:
    image: postgres:17
    container_name: infrastructure-ops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: app/Dockerfile

    image: infrastructure-ops-app:dev
    container_name: infrastructure-ops-web
    restart: unless-stopped

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8088"
      ]

    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    ports:
      - "${APP_PORT:-8088}:8088"

    depends_on:
      postgres:
        condition: service_healthy

  monitoring-worker:
    image: infrastructure-ops-app:dev
    container_name: infrastructure-ops-monitoring-worker
    restart: unless-stopped

    command:
      [
        "python",
        "-m",
        "app.workers.monitoring_worker"
      ]

    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONITORING_SCHEDULER_POLL_SECONDS: ${MONITORING_SCHEDULER_POLL_SECONDS:-5}

    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
